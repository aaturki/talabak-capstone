[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "talabak-capstone"
version = "0.1.0"
description = "Bilingual retail support with evidence-driven local evaluation"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["talabak"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

